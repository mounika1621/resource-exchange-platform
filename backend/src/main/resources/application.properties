spring.application.name=resource-exchange-platform

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8080}


# =========================================================
# DATABASE
# =========================================================
# Local machine:
# Uses MySQL by default.
#
# Render:
# Set DB_URL, DB_USERNAME, DB_PASSWORD and DB_DRIVER
# as environment variables to use H2.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_exchange?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false


# =========================================================
# JWT SECURITY
# =========================================================
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# =========================================================
# CORS
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


